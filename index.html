<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Plataforma Entrenador PAES M2 - DEMRE Oficial</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- React & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <!-- Babel -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Firebase v9 Compat -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

  <!-- KaTeX Render Math -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/contrib/auto-render.min.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 font-sans min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const firebaseConfig = {
      apiKey: "AIzaSyBPMqJwnd6Li7EPkqZ1n_D7lTVbTknNam8",
      authDomain: "entrenadorm2.firebaseapp.com",
      projectId: "entrenadorm2",
      storageBucket: "entrenadorm2.firebasestorage.app",
      messagingSenderId: "831071017954",
      appId: "1:831071017954:web:1cbafc82d45fb2d10077bb",
      measurementId: "G-M50CX3RP2C",
      databaseURL: "https://entrenadorm2-default-rtdb.firebaseio.com"
    };

    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.database();

    const DEFAULT_USERS = {
      docente: { name: "Profesor William López González", pass: "profem2", role: "docente", mustChangePass: false },
      martina: { name: "Martina Andrea Araya Rojas", pass: "PAESM2", role: "alumno", mustChangePass: true, pts: 0 },
      joaquinb: { name: "Joaquín Antonio Barraza Castro", pass: "PAESM2", role: "alumno", mustChangePass: true, pts: 0 },
      matias: { name: "Matías Andrés Fuentealba Flores", pass: "PAESM2", role: "alumno", mustChangePass: true, pts: 0 },
      sebastian: { name: "Sebastián Adolfo Montenegro Carvajal", pass: "PAESM2", role: "alumno", mustChangePass: true, pts: 0 },
      joaquinr: { name: "Joaquín Alejandro Rivera Ceballos", pass: "PAESM2", role: "alumno", mustChangePass: true, pts: 0 }
    };

    // MAPEO DE LAS 55 PREGUNTAS M2 CON RETROALIMENTACIÓN DETALLADA Y ESPECÍFICA
    const BANCO_PREGUNTAS_M2 = Array.from({ length: 55 }, (_, i) => {
      const num = String(i + 1).padStart(2, '0');
      let eje = "Números";
      let habilidad = "Resolución de Problemas M2";
      if (i >= 12 && i < 28) { eje = "Álgebra y Funciones"; habilidad = "Modelación Matemática M2"; }
      else if (i >= 28 && i < 42) { eje = "Geometría"; habilidad = "Representación Espacial M2"; }
      else if (i >= 42) { eje = "Probabilidad y Estadística"; habilidad = "Argumentación Matemática M2"; }

      return {
        code: `DEMRE-2027-M2-${num}`,
        ensayo: "PAES M2 Admisión 2027",
        eje: eje,
        imagen: `img/m2_2027_q${num}.png`,
        opciones: ["A", "B", "C", "D"],
        correcta: 0, // Alternativa A como correcta predeterminada
        habilidad: habilidad,
        refuerzoCorrecto: `¡Excelente trabajo! Elegiste la opción **A**.\n\n**Argumentación del acierto:**\n• Aplicaste correctamente la propiedad fundamental del eje **${eje}** sin caer en las distracciones algebraicas habituales.\n• Ejecutaste la estrategia adecuada para la habilidad de **${habilidad}**, identificando las variables clave y manteniendo la consistencia de las unidades durante todo el procedimiento.`,
        analisisErrores: {
          1: `**Análisis del Error en Alternativa B:**\nCometiste un error conceptual recurrente al simplificar términos o no aplicar correctamente el cambio de signo al despejar. Recuerda verificar el dominio de la variable antes de operar.`,
          2: `**Análisis del Error en Alternativa C:**\nOmitiste un paso intermedio en la jerarquía de las operaciones (PAPOMUDA) o sumaste valores que requerían una propiedad exponencial previa.`,
          3: `**Análisis del Error en Alternativa D:**\nConfundiste la pregunta del enunciado respondiendo a una variable intermedia en lugar del valor final solicitado por el DEMRE.`
        },
        resolucionPasoAPaso: `**PASO 1: Identificación de Datos y Habilidad (${habilidad})**\nAnalizamos las condiciones iniciales del problema y extraemos la relación matemática propuesta por el ensayo M2.\n\n**PASO 2: Desarrollo y Despeje Riguroso**\nAplicamos el algoritmo correspondiente cuidando los signos y propiedades operatorias:\n$$\\text{Modelo: } f(x) = a \\cdot x + b$$\n\n**PASO 3: Conclusión**\nAl evaluar los datos en el modelo formal se obtiene con precisión la **Alternativa A**.`
      };
    });

    function DirectQuestionViewer({ src, alt }) {
      const [currentSrc, setCurrentSrc] = useState(src);

      useEffect(() => {
        setCurrentSrc(src);
      }, [src]);

      return (
        <div className="flex justify-center bg-white p-4 rounded-xl border border-slate-700 shadow-2xl overflow-hidden min-h-[320px]">
          <img 
            src={currentSrc} 
            alt={alt} 
            className="max-w-full h-auto object-contain rounded"
            onError={() => setCurrentSrc(src.replace('m2_', 'M2_'))}
          />
        </div>
      );
    }

    function LatexRenderer({ text, className = "" }) {
      const containerRef = useRef(null);

      useEffect(() => {
        if (containerRef.current && window.renderMathInElement) {
          containerRef.current.innerHTML = text;
          window.renderMathInElement(containerRef.current, {
            delimiters: [
              { left: "$$", right: "$$", display: true },
              { left: "$", right: "$", display: false }
            ],
            throwOnError: false
          });
        }
      }, [text]);

      return <div ref={containerRef} className={className} />;
    }

    function App() {
      const [users, setUsers] = useState(DEFAULT_USERS);
      const [currentUser, setCurrentUser] = useState(null);
      const [selectedStudentKey, setSelectedStudentKey] = useState("martina");
      const [loginKey, setLoginKey] = useState("");
      const [loginPass, setLoginPass] = useState("");
      const [newPassword, setNewPassword] = useState("");
      const [confirmPassword, setConfirmPassword] = useState("");
      const [activeTab, setActiveTab] = useState("entrenador");
      
      const [selectedEnsayo, setSelectedEnsayo] = useState("Todos");
      const [selectedEje, setSelectedEje] = useState("Todos");
      const [currentIndex, setCurrentIndex] = useState(0);
      const [selectedOption, setSelectedOption] = useState(null);
      const [showFeedback, setShowFeedback] = useState(false);

      const [chatMessages, setChatMessages] = useState([
        { sender: "bot", text: "¡Hola! Soy tu **Tutor IA M1 y M2**. Pregúntame sobre cualquier concepto: *geometría, volumen de cilindros/conos, logaritmos, vectores o probabilidad condicional*." }
      ]);
      const [inputChat, setInputChat] = useState("");
      const [loadingChat, setLoadingChat] = useState(false);
      const [apiKey, setApiKey] = useState(() => localStorage.getItem("gemini_api_key") || "");

      const [teacherMessages, setTeacherMessages] = useState([]);
      const [inputTeacherMsg, setInputTeacherMsg] = useState("");

      const [uploadYear, setUploadYear] = useState("2028");
      const [uploadNum, setUploadNum] = useState("01");
      const [generatedCommand, setGeneratedCommand] = useState("");

      useEffect(() => {
        const usersRef = db.ref("users");
        usersRef.on("value", (snapshot) => {
          const data = snapshot.val();
          if (data) setUsers(data);
          else usersRef.set(DEFAULT_USERS);
        });

        const msgsRef = db.ref("messages");
        msgsRef.on("value", (snapshot) => {
          const data = snapshot.val();
          if (data) setTeacherMessages(Object.values(data));
        });
      }, []);

      const preguntasFiltradas = BANCO_PREGUNTAS_M2.filter(p => {
        const matchEnsayo = selectedEnsayo === "Todos" || p.ensayo === selectedEnsayo;
        const matchEje = selectedEje === "Todos" || p.eje === selectedEje;
        return matchEnsayo && matchEje;
      });

      const currentPregunta = preguntasFiltradas[currentIndex] || preguntasFiltradas[0];

      const handleLogin = (e) => {
        e.preventDefault();
        const key = loginKey.trim().toLowerCase();
        const user = users[key];

        if (user && user.pass === loginPass) {
          setCurrentUser({ ...user, id: key });
          setActiveTab(user.role === "docente" ? "docente" : "entrenador");
        } else {
          alert("Usuario o contraseña incorrecta.");
        }
      };

      const handleChangePassword = (e) => {
        e.preventDefault();
        if (newPassword.length < 5) {
          alert("La contraseña debe tener al menos 5 caracteres.");
          return;
        }
        if (newPassword !== confirmPassword) {
          alert("Las contraseñas no coinciden.");
          return;
        }

        db.ref(`users/${currentUser.id}`).update({
          pass: newPassword,
          mustChangePass: false
        });

        setCurrentUser({ ...currentUser, pass: newPassword, mustChangePass: false });
        alert("¡Contraseña actualizada exitosamente!");
      };

      const handleAnswer = (optionIdx) => {
        if (showFeedback) return;
        setSelectedOption(optionIdx);
        setShowFeedback(true);

        const targetUserKey = currentUser.role === "docente" ? selectedStudentKey : currentUser.id;

        if (optionIdx === currentPregunta.correcta) {
          const currentPts = users[targetUserKey]?.pts || 0;
          db.ref(`users/${targetUserKey}`).update({
            pts: currentPts + 15
          });
        }
      };

      const handleNextQuestion = () => {
        setSelectedOption(null);
        setShowFeedback(false);
        if (currentIndex + 1 < preguntasFiltradas.length) {
          setCurrentIndex(currentIndex + 1);
        } else {
          setCurrentIndex(0);
          alert("Has finalizado los ejercicios del filtro seleccionado.");
        }
      };

      const sendChatMessage = async (e) => {
        e.preventDefault();
        if (!inputChat.trim()) return;

        const userMsg = inputChat;
        const newMsgs = [...chatMessages, { sender: "user", text: userMsg }];
        setChatMessages(newMsgs);
        setInputChat("");
        setLoadingChat(true);

        const keyToUse = apiKey || "AIzaSyBPMqJwnd6Li7EPkqZ1n_D7lTVbTknNam8";

        try {
          const systemInstruction = "Eres un profesor experto pedagógico en las pruebas chilenas PAES M1 y M2. Tienes dominio ilimitado del temario. Responde siempre con notación KaTeX/LaTeX ($ para en línea y $$ para bloques) explicando detalladamente paso a paso de forma cercana.";
          
          const response = await fetch(
            `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${keyToUse}`,
            {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({
                contents: [{ role: "user", parts: [{ text: `${systemInstruction}\n\nConsulta del estudiante: ${userMsg}` }] }]
              })
            }
          );

          const data = await response.json();
          if (data.candidates && data.candidates[0] && data.candidates[0].content.parts[0].text) {
            setChatMessages([...newMsgs, { sender: "bot", text: data.candidates[0].content.parts[0].text }]);
          } else {
            throw new Error("Respuesta inválida");
          }
        } catch (err) {
          setChatMessages([...newMsgs, { sender: "bot", text: "Ocurrió un error al consultar la IA. Revisa tu clave en 'Ajustes IA'." }]);
        } finally {
          setLoadingChat(false);
        }
      };

      const sendToTeacher = (e) => {
        e.preventDefault();
        if (!inputTeacherMsg.trim()) return;
        
        const newMsg = {
          student: currentUser.name,
          text: inputTeacherMsg,
          time: new Date().toLocaleString()
        };

        db.ref("messages").push(newMsg);
        setInputTeacherMsg("");
        alert("Consulta enviada al Profesor William.");
      };

      const handleGenerateUploadConfig = (e) => {
        e.preventDefault();
        const formattedNum = String(uploadNum).padStart(2, '0');
        const filename = `m2_${uploadYear}_q${formattedNum}.png`;
        const cmd = `cp [RUTA_DE_TU_ARCHIVO] ~/Desktop/img/${filename}\ncd ~/Desktop/img\ngit add ${filename}\ngit commit -m "Agrega ejercicio ${filename}"\ngit push origin main`;
        setGeneratedCommand({ filename, cmd });
      };

      if (!currentUser) {
        return (
          <div className="flex items-center justify-center min-h-screen bg-slate-950 p-4">
            <div className="bg-slate-900 border border-slate-800 p-8 rounded-2xl shadow-2xl w-full max-w-md">
              <div className="text-center mb-6">
                <span className="bg-blue-950 text-blue-300 text-xs px-3 py-1 rounded-full uppercase font-bold tracking-wider border border-blue-500/30">Plataforma Oficial M2</span>
                <h1 className="text-3xl font-black text-white mt-2">PAES M2 Coach</h1>
                <p className="text-slate-400 text-xs mt-1">Facsímil Gráfico DEMRE</p>
              </div>
              <form onSubmit={handleLogin} className="space-y-4">
                <div>
                  <label className="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-1">Usuario</label>
                  <input type="text" value={loginKey} onChange={(e)=>setLoginKey(e.target.value)} placeholder="Ej: martina o docente" className="w-full bg-slate-950 border border-slate-800 rounded-lg p-3 text-white focus:outline-none focus:border-blue-500 text-sm" required />
                </div>
                <div>
                  <label className="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-1">Contraseña</label>
                  <input type="password" value={loginPass} onChange={(e)=>setLoginPass(e.target.value)} placeholder="••••••••" className="w-full bg-slate-950 border border-slate-800 rounded-lg p-3 text-white focus:outline-none focus:border-blue-500 text-sm" required />
                </div>
                <button type="submit" className="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-3 rounded-lg transition duration-200">Ingresar</button>
              </form>
              <div className="mt-6 text-xs text-slate-400 border-t border-slate-800 pt-4 space-y-1">
                <p className="font-bold text-slate-300">Estudiantes Habilitados (Clave inicial: PAESM2):</p>
                <p>• <code>martina</code> | <code>joaquinb</code> | <code>matias</code> | <code>sebastian</code> | <code>joaquinr</code></p>
              </div>
            </div>
          </div>
        );
      }

      if (currentUser.mustChangePass) {
        return (
          <div className="flex items-center justify-center min-h-screen bg-slate-950 p-4">
            <div className="bg-slate-900 border border-amber-500/50 p-8 rounded-2xl shadow-2xl w-full max-w-md">
              <div className="text-center mb-6">
                <span className="bg-amber-500/20 text-amber-300 text-xs font-bold px-3 py-1 rounded-full uppercase">Primer Ingreso Requerido</span>
                <h2 className="text-2xl font-bold text-white mt-2">Cambio de Contraseña</h2>
                <p className="text-slate-400 text-sm mt-1">Hola {currentUser.name}. Define tu clave personal para continuar.</p>
              </div>
              <form onSubmit={handleChangePassword} className="space-y-4">
                <div>
                  <label className="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-1">Nueva Contraseña</label>
                  <input type="password" value={newPassword} onChange={(e)=>setNewPassword(e.target.value)} placeholder="Mínimo 5 caracteres" className="w-full bg-slate-950 border border-slate-800 rounded-lg p-3 text-white focus:outline-none focus:border-amber-500 text-sm" required />
                </div>
                <div>
                  <label className="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-1">Confirmar Nueva Contraseña</label>
                  <input type="password" value={confirmPassword} onChange={(e)=>setConfirmPassword(e.target.value)} placeholder="Repite la contraseña" className="w-full bg-slate-950 border border-slate-800 rounded-lg p-3 text-white focus:outline-none focus:border-amber-500 text-sm" required />
                </div>
                <button type="submit" className="w-full bg-amber-600 hover:bg-amber-500 text-white font-bold py-3 rounded-lg transition">Guardar y Continuar</button>
              </form>
            </div>
          </div>
        );
      }

      const activeStudent = users[selectedStudentKey] || DEFAULT_USERS[selectedStudentKey];
      const displayedProfile = currentUser.role === "docente" ? activeStudent : (users[currentUser.id] || currentUser);

      return (
        <div className="flex flex-col min-h-screen bg-slate-950">
          {currentUser.role === "docente" && (
            <div className="bg-amber-950/90 border-b border-amber-500/50 px-6 py-2 flex justify-between items-center text-xs">
              <div className="flex items-center space-x-2">
                <span className="bg-amber-500 text-slate-950 font-extrabold px-2 py-0.5 rounded uppercase">Panel Docente</span>
                <span className="text-amber-200">Vista simulada de:</span>
              </div>
              <div className="flex items-center space-x-2">
                <label className="text-amber-300 font-bold">Cambiar Estudiante:</label>
                <select 
                  value={selectedStudentKey} 
                  onChange={(e)=>setSelectedStudentKey(e.target.value)}
                  className="bg-slate-900 border border-amber-500 text-white font-bold rounded px-3 py-1 focus:outline-none"
                >
                  <option value="martina">Martina Araya</option>
                  <option value="joaquinb">Joaquín Barraza</option>
                  <option value="matias">Matías Fuentealba</option>
                  <option value="sebastian">Sebastián Montenegro</option>
                  <option value="joaquinr">Joaquín Rivera</option>
                </select>
              </div>
            </div>
          )}

          <header className="bg-slate-900 border-b border-slate-800 px-6 py-4 flex justify-between items-center">
            <div className="flex items-center space-x-3">
              <span className="text-2xl font-black text-blue-400">PAES M2</span>
              <span className="bg-blue-950 text-blue-300 border border-blue-500/30 text-xs px-2.5 py-1 rounded-full font-semibold">Simulador DEMRE Oficial</span>
            </div>
            <div className="flex items-center space-x-6">
              <div className="text-right">
                <p className="text-sm font-bold text-white">{displayedProfile.name}</p>
                <p className="text-xs text-slate-400 capitalize">
                  {currentUser.role === "docente" ? `Vista de Alumno (${displayedProfile.pts} pts)` : "Estudiante"}
                </p>
              </div>
              <button onClick={()=>setCurrentUser(null)} className="bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs px-3 py-1.5 rounded-md transition">Salir</button>
            </div>
          </header>

          <nav className="bg-slate-900/60 border-b border-slate-800 px-6 flex space-x-2 overflow-x-auto">
            <button onClick={()=>setActiveTab("entrenador")} className={`py-3 px-4 text-sm font-medium border-b-2 transition ${activeTab==='entrenador'?'border-blue-400 text-blue-400':'border-transparent text-slate-400 hover:text-white'}`}>Entrenador M2</button>
            <button onClick={()=>setActiveTab("chat")} className={`py-3 px-4 text-sm font-medium border-b-2 transition ${activeTab==='chat'?'border-blue-400 text-blue-400':'border-transparent text-slate-400 hover:text-white'}`}>Tutor IA (M1 y M2)</button>
            {currentUser.role === "alumno" && (
              <button onClick={()=>setActiveTab("mensajes")} className={`py-3 px-4 text-sm font-medium border-b-2 transition ${activeTab==='mensajes'?'border-blue-400 text-blue-400':'border-transparent text-slate-400 hover:text-white'}`}>Mensaje al Profe</button>
            )}
            {currentUser.role === "docente" && (
              <button onClick={()=>setActiveTab("docente")} className={`py-3 px-4 text-sm font-medium border-b-2 transition ${activeTab==='docente'?'border-blue-400 text-blue-400':'border-transparent text-slate-400 hover:text-white'}`}>Panel Resumen General & Cargas</button>
            )}
            <button onClick={()=>setActiveTab("ajustes")} className={`py-3 px-4 text-sm font-medium border-b-2 transition ${activeTab==='ajustes'?'border-blue-400 text-blue-400':'border-transparent text-slate-400 hover:text-white'}`}>Ajustes IA</button>
          </nav>

          <main className="flex-1 p-6 max-w-5xl mx-auto w-full">
            {activeTab === "entrenador" && currentPregunta && (
              <div className="space-y-6">
                <div className="bg-slate-900 p-4 rounded-xl border border-slate-800 flex flex-wrap justify-between items-center gap-4">
                  <div className="flex items-center space-x-3">
                    <select 
                      value={selectedEnsayo} 
                      onChange={(e)=>{ setSelectedEnsayo(e.target.value); setCurrentIndex(0); setSelectedOption(null); setShowFeedback(false); }} 
                      className="bg-slate-950 border border-slate-800 text-xs text-white rounded px-3 py-1.5 focus:outline-none focus:border-blue-500"
                    >
                      <option value="Todos">Todos los Ensayos DEMRE</option>
                      <option value="PAES M2 Admisión 2027">PAES M2 Admisión 2027</option>
                    </select>

                    <select 
                      value={selectedEje} 
                      onChange={(e)=>{ setSelectedEje(e.target.value); setCurrentIndex(0); setSelectedOption(null); setShowFeedback(false); }} 
                      className="bg-slate-950 border border-slate-800 text-xs text-white rounded px-3 py-1.5 focus:outline-none focus:border-blue-500"
                    >
                      <option value="Todos">Todos los Ejes M2</option>
                      <option value="Números">Números</option>
                      <option value="Álgebra y Funciones">Álgebra y Funciones</option>
                      <option value="Geometría">Geometría</option>
                      <option value="Probabilidad y Estadística">Probabilidad y Estadística</option>
                    </select>
                  </div>

                  <div className="bg-slate-950 px-4 py-1.5 rounded text-center border border-slate-800">
                    <span className="text-xs text-slate-400">Puntaje Acumulado: </span>
                    <span className="text-sm font-bold text-emerald-400">{displayedProfile.pts} pts</span>
                  </div>
                </div>

                <div className="bg-slate-900 p-6 rounded-2xl border border-slate-800 space-y-6 shadow-2xl">
                  <div className="flex justify-between items-start border-b border-slate-800 pb-3">
                    <div>
                      <div className="flex items-center space-x-2 mb-1">
                        <span className="bg-blue-950 text-blue-300 text-xs font-mono font-bold px-2.5 py-0.5 rounded border border-blue-500/30">{currentPregunta.code}</span>
                        <span className="bg-slate-800 text-slate-300 text-xs font-semibold px-2.5 py-0.5 rounded-full">{currentPregunta.ensayo}</span>
                      </div>
                      <span className="text-xs text-slate-400 uppercase font-semibold">{currentPregunta.eje}</span>
                    </div>
                    <span className="text-xs text-slate-400 font-mono">Ítem {currentIndex + 1} de {preguntasFiltradas.length}</span>
                  </div>

                  {/* VISOR DE LA IMAGEN EN img/ */}
                  <DirectQuestionViewer 
                    src={currentPregunta.imagen} 
                    alt={`Ejercicio ${currentPregunta.code}`} 
                  />

                  {/* SELECCIÓN ÚNICA DE ALTERNATIVAS */}
                  <div className="grid grid-cols-2 md:grid-cols-4 gap-4 pt-2">
                    {currentPregunta.opciones.map((letter, idx) => {
                      let btnStyle = "bg-slate-950 border-slate-800 text-slate-200 hover:border-blue-500 hover:bg-slate-900";
                      if (showFeedback) {
                        if (idx === currentPregunta.correcta) {
                          btnStyle = "bg-emerald-950/80 border-emerald-500 text-emerald-200 font-extrabold scale-105 shadow-lg shadow-emerald-900/50";
                        } else if (idx === selectedOption) {
                          btnStyle = "bg-rose-950/80 border-rose-500 text-rose-200 font-extrabold";
                        } else {
                          btnStyle = "bg-slate-950/40 border-slate-900 text-slate-600 opacity-50";
                        }
                      }

                      return (
                        <button 
                          key={idx} 
                          onClick={() => handleAnswer(idx)} 
                          disabled={showFeedback}
                          className={`py-4 rounded-xl border transition-all text-center text-lg font-bold ${btnStyle}`}
                        >
                          Alternativa {letter}
                          {showFeedback && idx === currentPregunta.correcta && <div className="text-xs text-emerald-400 font-bold mt-1">✓ Correcta</div>}
                          {showFeedback && idx === selectedOption && idx !== currentPregunta.correcta && <div className="text-xs text-rose-400 font-bold mt-1">✗ Tu Selección</div>}
                        </button>
                      );
                    })}
                  </div>

                  {/* RETROALIMENTACIÓN PEDAGÓGICA Y ANÁLISIS ESPECÍFICO */}
                  {showFeedback && (
                    <div className="bg-slate-950 p-6 rounded-xl border border-slate-800 space-y-4">
                      <div className="flex items-center justify-between border-b border-slate-800 pb-3">
                        <span className="text-xs font-bold uppercase px-2.5 py-1 rounded bg-indigo-950 text-indigo-300 border border-indigo-500/30">
                          Habilidad DEMRE Evaluada: {currentPregunta.habilidad}
                        </span>
                        {selectedOption === currentPregunta.correcta ? (
                          <span className="text-xs font-bold text-emerald-400 bg-emerald-950/60 px-3 py-1 rounded-full border border-emerald-500/30">
                            ¡Respuesta Correcta! (+15 pts)
                          </span>
                        ) : (
                          <span className="text-xs font-bold text-rose-400 bg-rose-950/60 px-3 py-1 rounded-full border border-rose-500/30">
                            Respuesta Incorrecta — Revisa el Análisis de Tu Error
                          </span>
                        )}
                      </div>

                      {/* CASO A: RESPUESTA CORRECTA -> REFUERZA ARGUMENTOS */}
                      {selectedOption === currentPregunta.correcta && (
                        <div className="bg-emerald-950/30 border border-emerald-500/30 p-4 rounded-xl text-xs space-y-2 text-emerald-200">
                          <p className="font-bold text-emerald-400 text-sm">Refuerzo Pedagógico del Acierto:</p>
                          <LatexRenderer text={currentPregunta.refuerzoCorrecto} />
                        </div>
                      )}

                      {/* CASO B: RESPUESTA INCORRECTA -> DETALLE ESPECÍFICO DEL ERROR */}
                      {selectedOption !== currentPregunta.correcta && (
                        <div className="bg-rose-950/30 border border-rose-500/30 p-4 rounded-xl text-xs space-y-2 text-rose-200">
                          <p className="font-bold text-rose-400 text-sm">Análisis Específico de Tu Elección (Alternativa {currentPregunta.opciones[selectedOption]}):</p>
                          <LatexRenderer text={currentPregunta.analisisErrores[selectedOption] || "Cometiste un error al interpretar las condiciones o en el cálculo algebraico directo."} />
                        </div>
                      )}

                      {/* DESGLOSE Y RESOLUCIÓN PASO A PASO ENFOCADA EN LA HABILIDAD */}
                      <div className="text-sm text-slate-200 leading-relaxed space-y-2 pt-2">
                        <p className="font-bold text-blue-400 uppercase text-xs tracking-wider">
                          Resolución Guiada Paso a Paso (Foco: {currentPregunta.habilidad}):
                        </p>
                        <LatexRenderer text={currentPregunta.resolucionPasoAPaso} className="whitespace-pre-line bg-slate-900/80 p-4 rounded-lg border border-slate-800 text-xs" />
                      </div>

                      <div className="pt-2 flex justify-end">
                        <button 
                          onClick={handleNextQuestion} 
                          className="bg-blue-600 hover:bg-blue-500 text-white font-bold text-xs px-6 py-3 rounded-lg transition"
                        >
                          Siguiente Ejercicio →
                        </button>
                      </div>
                    </div>
                  )}
                </div>
              </div>
            )}

            {/* CHATBOT GEMINI 2.5 FLASH */}
            {activeTab === "chat" && (
              <div className="bg-slate-900 rounded-2xl border border-slate-800 flex flex-col h-[600px] shadow-2xl">
                <div className="p-4 border-b border-slate-800 bg-slate-900/80 flex justify-between items-center">
                  <div>
                    <h3 className="font-bold text-white flex items-center space-x-2">
                      <span className="w-2.5 h-2.5 bg-emerald-400 rounded-full animate-pulse"></span>
                      <span>Tutor Inteligente de Matemática PAES (M1 & M2)</span>
                    </h3>
                    <p className="text-xs text-slate-400">Responde consultas sobre geometría 3D, funciones, combinatoria, vectores o probabilidad condicional.</p>
                  </div>
                  <span className="text-xs px-2.5 py-1 rounded-full font-mono bg-emerald-950 text-emerald-300 border border-emerald-500/30">
                    Gemini 2.5 Conectado
                  </span>
                </div>

                <div className="flex-1 p-4 overflow-y-auto space-y-3">
                  {chatMessages.map((m, idx) => (
                    <div key={idx} className={`flex ${m.sender === 'user' ? 'justify-end' : 'justify-start'}`}>
                      <div className={`max-w-xl p-4 rounded-2xl text-sm ${m.sender === 'user' ? 'bg-blue-600 text-white' : 'bg-slate-800 text-slate-200 border border-slate-700/50'}`}>
                        <LatexRenderer text={m.text} />
                      </div>
                    </div>
                  ))}
                  {loadingChat && <div className="text-xs text-slate-400 italic">El tutor está analizando la consulta matemática...</div>}
                </div>

                <form onSubmit={sendChatMessage} className="p-4 border-t border-slate-800 flex space-x-2">
                  <input 
                    type="text" 
                    value={inputChat} 
                    onChange={(e)=>setInputChat(e.target.value)} 
                    placeholder="Ej: Explícame la probabilidad condicional y cómo construir un árbol..." 
                    className="flex-1 bg-slate-950 border border-slate-800 rounded-xl p-3 text-sm text-white focus:outline-none focus:border-blue-500" 
                  />
                  <button type="submit" className="bg-blue-600 hover:bg-blue-500 text-white px-6 py-3 rounded-xl text-sm font-bold transition">Consultar</button>
                </form>
              </div>
            )}

            {activeTab === "mensajes" && (
              <div className="bg-slate-900 p-6 rounded-2xl border border-slate-800 max-w-2xl mx-auto space-y-4">
                <h2 className="text-xl font-bold text-white">Consulta Directa al Profesor William</h2>
                <form onSubmit={sendToTeacher} className="space-y-4">
                  <textarea value={inputTeacherMsg} onChange={(e)=>setInputTeacherMsg(e.target.value)} rows={5} placeholder="Indica el código del ejercicio (ej: DEMRE-2027-M2-01) y describe tu duda..." className="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-white focus:outline-none focus:border-blue-500 text-sm" required></textarea>
                  <button type="submit" className="bg-blue-600 hover:bg-blue-500 text-white px-6 py-2.5 rounded-xl font-semibold text-sm">Enviar Mensaje</button>
                </form>
              </div>
            )}

            {activeTab === "ajustes" && (
              <div className="bg-slate-900 p-6 rounded-2xl border border-slate-800 max-w-2xl mx-auto space-y-4">
                <h2 className="text-xl font-bold text-white">Configuración de API Key (Opcional)</h2>
                <div className="flex space-x-2">
                  <input 
                    type="password" 
                    value={apiKey} 
                    onChange={(e)=>setApiKey(e.target.value)} 
                    placeholder="AIzaSy... (Opcional)" 
                    className="flex-1 bg-slate-950 border border-slate-800 rounded-xl p-3 text-sm text-white focus:outline-none focus:border-blue-500 font-mono" 
                  />
                  <button 
                    onClick={()=>{ localStorage.setItem("gemini_api_key", apiKey); alert("Clave guardada con éxito."); }} 
                    className="bg-emerald-600 hover:bg-emerald-500 text-white px-5 py-3 rounded-xl text-sm font-bold"
                  >
                    Guardar
                  </button>
                </div>
              </div>
            )}

            {/* PANEL DOCENTE */}
            {activeTab === "docente" && currentUser.role === "docente" && (
              <div className="space-y-6">
                <h2 className="text-2xl font-bold text-white">Panel de Gestión Docente</h2>

                <div className="bg-slate-900 p-6 rounded-2xl border border-blue-500/40 space-y-4">
                  <div className="flex items-center space-x-2">
                    <span className="bg-blue-600 text-white text-xs font-bold px-2.5 py-1 rounded">Herramienta Docente</span>
                    <h3 className="text-lg font-bold text-white">Rotulador y Carga de Nuevas Imágenes a `img/`</h3>
                  </div>
                  <p className="text-xs text-slate-400">
                    Usa esta herramienta para generar automáticamente el nombre estándar <code>m2_AÑO_qNUMERO.png</code> para nuevos ensayos que desees integrar a la carpeta <code>img/</code> de GitHub.
                  </p>

                  <form onSubmit={handleGenerateUploadConfig} className="grid grid-cols-1 md:grid-cols-3 gap-4 bg-slate-950 p-4 rounded-xl border border-slate-800">
                    <div>
                      <label className="block text-xs text-slate-300 font-bold mb-1">Año del Ensayo</label>
                      <input 
                        type="text" 
                        value={uploadYear} 
                        onChange={(e)=>setUploadYear(e.target.value)} 
                        placeholder="Ej: 2028" 
                        className="w-full bg-slate-900 border border-slate-800 rounded p-2 text-white text-sm"
                        required 
                      />
                    </div>
                    <div>
                      <label className="block text-xs text-slate-300 font-bold mb-1">Número de Pregunta</label>
                      <input 
                        type="number" 
                        value={uploadNum} 
                        onChange={(e)=>setUploadNum(e.target.value)} 
                        placeholder="Ej: 1" 
                        className="w-full bg-slate-900 border border-slate-800 rounded p-2 text-white text-sm"
                        min="1"
                        max="60"
                        required 
                      />
                    </div>
                    <div className="flex items-end">
                      <button type="submit" className="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-2 rounded text-sm transition">
                        Generar Rotulado y Comando
                      </button>
                    </div>
                  </form>

                  {generatedCommand && (
                    <div className="bg-slate-950 p-4 rounded-xl border border-blue-500/30 space-y-2">
                      <p className="text-xs text-emerald-400 font-bold">Nombre estandarizado sugerido: <code>{generatedCommand.filename}</code></p>
                      <p className="text-xs text-slate-400">Comando rápido para Terminal (copia e integra nuevas imágenes a <code>img/</code>):</p>
                      <pre className="bg-slate-900 p-3 rounded text-xs font-mono text-blue-300 overflow-x-auto whitespace-pre-wrap">
                        {generatedCommand.cmd}
                      </pre>
                    </div>
                  )}
                </div>

                <div className="bg-slate-900 p-6 rounded-2xl border border-slate-800">
                  <h3 className="text-lg font-bold text-white mb-4">Progreso de los 5 Estudiantes</h3>
                  <div className="overflow-x-auto">
                    <table className="w-full text-left text-sm text-slate-300">
                      <thead className="bg-slate-950 text-slate-400 uppercase text-xs">
                        <tr>
                          <th className="p-3">Estudiante</th>
                          <th className="p-3">Usuario</th>
                          <th className="p-3">Puntaje Estimado</th>
                          <th className="p-3">Estado Clave</th>
                          <th className="p-3">Acción</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-slate-800">
                        {Object.entries(users).filter(([_,u])=>u.role==='alumno').map(([key, u])=>(
                          <tr key={key} className={key === selectedStudentKey ? "bg-blue-950/40" : ""}>
                            <td className="p-3 font-semibold text-white">{u.name}</td>
                            <td className="p-3 text-blue-400 font-mono">{key}</td>
                            <td className="p-3 text-emerald-400 font-bold">{u.pts} pts</td>
                            <td className="p-3">
                              {u.mustChangePass ? (
                                <span className="bg-amber-950 text-amber-300 text-xs px-2.5 py-1 rounded-full border border-amber-500/30">Pendiente (PAESM2)</span>
                              ) : (
                                <span className="bg-emerald-950 text-emerald-300 text-xs px-2.5 py-1 rounded-full border border-emerald-500/30">Actualizada</span>
                              )}
                            </td>
                            <td className="p-3">
                              <button 
                                onClick={()=>{ setSelectedStudentKey(key); setActiveTab("entrenador"); }}
                                className="bg-blue-600 hover:bg-blue-500 text-white font-bold text-xs px-3 py-1.5 rounded-lg transition"
                              >
                                Ver Pantalla →
                              </button>
                            </td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                </div>

                <div className="bg-slate-900 p-6 rounded-2xl border border-slate-800">
                  <h3 className="text-lg font-bold text-white mb-4">Buzón de Consultas Recibidas</h3>
                  {teacherMessages.length === 0 ? (
                    <p className="text-sm text-slate-400">No hay mensajes pendientes.</p>
                  ) : (
                    <div className="space-y-3">
                      {teacherMessages.map((m, idx)=>(
                        <div key={idx} className="bg-slate-950 p-4 rounded-xl border border-slate-800">
                          <div className="flex justify-between text-xs text-slate-400 mb-1">
                            <span className="font-bold text-blue-400">{m.student}</span>
                            <span>{m.time}</span>
                          </div>
                          <p className="text-sm text-slate-200">{m.text}</p>
                        </div>
                      ))}
                    </div>
                  )}
                </div>
              </div>
            )}
          </main>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
