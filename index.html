    function DirectQuestionViewer({ src, alt }) {
      const [currentSrc, setCurrentSrc] = useState(src);

      useEffect(() => {
        setCurrentSrc(src);
      }, [src]);

      return (
        <div className="flex justify-center bg-white p-4 rounded-xl border border-slate-700 shadow-2xl overflow-hidden min-h-[320px]">
          <img 
            src={currentSrc} 
            alt={alt} 
            className="max-w-full h-auto object-contain rounded"
            onError={() => setCurrentSrc(src.replace('m2_', 'M2_'))}
          />
        </div>
      );
    }

    function LatexRenderer({ text, className = "" }) {
      const containerRef = useRef(null);

      useEffect(() => {
        if (containerRef.current && window.renderMathInElement) {
          let cleanText = text || "";
          cleanText = cleanText.replace(/\(\$(\d+)\$\)/g, '$$$1$$');

          containerRef.current.innerHTML = cleanText;
          window.renderMathInElement(containerRef.current, {
            delimiters: [
              { left: "$$", right: "$$", display: true },
              { left: "$", right: "$", display: false }
            ],
            throwOnError: false
          });
        }
      }, [text]);

      return <div ref={containerRef} className={className} />;
    }

              <div className="space-y-6">
                <h2 className="text-2xl font-bold text-white">Panel de Gestión Docente</h2>

                <div className="bg-slate-900 p-6 rounded-2xl border border-blue-500/40 space-y-4">
                  <div className="flex items-center space-x-2">
                    <span className="bg-blue-600 text-white text-xs font-bold px-2.5 py-1 rounded">Herramienta Docente</span>
                    <h3 className="text-lg font-bold text-white">Rotulador y Carga de Nuevas Imágenes a `img/`</h3>
                  </div>
                  <p className="text-xs text-slate-400">
                    Usa esta herramienta para generar automáticamente el nombre estándar <code>m2_AÑO_qNUMERO.png</code> para nuevos ensayos que desees integrar a la carpeta <code>img/</code> de GitHub.
                  </p>

                  <form onSubmit={handleGenerateUploadConfig} className="grid grid-cols-1 md:grid-cols-3 gap-4 bg-slate-950 p-4 rounded-xl border border-slate-800">
                    <div>
                      <label className="block text-xs text-slate-300 font-bold mb-1">Año del Ensayo</label>
                      <input 
                        type="text" 
                        value={uploadYear} 
                        onChange={(e)=>setUploadYear(e.target.value)} 
                        placeholder="Ej: 2028" 
                        className="w-full bg-slate-900 border border-slate-800 rounded p-2 text-white text-sm"
                        required 
                      />
                    </div>
                    <div>
                      <label className="block text-xs text-slate-300 font-bold mb-1">Número de Pregunta</label>
                      <input 
                        type="number" 
                        value={uploadNum} 
                        onChange={(e)=>setUploadNum(e.target.value)} 
                        placeholder="Ej: 1" 
                        className="w-full bg-slate-900 border border-slate-800 rounded p-2 text-white text-sm"
                        min="1"
                        max="60"
                        required 
                      />
                    </div>
                    <div className="flex items-end">
                      <button type="submit" className="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-2 rounded text-sm transition">
                        Generar Rotulado y Comando
                      </button>
                    </div>
                  </form>

                  {generatedCommand && (
                    <div className="bg-slate-950 p-4 rounded-xl border border-blue-500/30 space-y-2">
                      <p className="text-xs text-emerald-400 font-bold">Nombre estandarizado sugerido: <code>{generatedCommand.filename}</code></p>
                      <p className="text-xs text-slate-400">Comando rápido para Terminal (copia e integra nuevas imágenes a <code>img/</code>):</p>
                      <pre className="bg-slate-900 p-3 rounded text-xs font-mono text-blue-300 overflow-x-auto whitespace-pre-wrap">
                        {generatedCommand.cmd}
                      </pre>
                    </div>
                  )}
                </div>

                <div className="bg-slate-900 p-6 rounded-2xl border border-slate-800">
                  <h3 className="text-lg font-bold text-white mb-4">Progreso de los 5 Estudiantes</h3>
                  <div className="overflow-x-auto">
                    <table className="w-full text-left text-sm text-slate-300">
                      <thead className="bg-slate-950 text-slate-400 uppercase text-xs">
                        <tr>
                          <th className="p-3">Estudiante</th>
                          <th className="p-3">Usuario</th>
                          <th className="p-3">Puntaje Estimado</th>
                          <th className="p-3">Estado Clave</th>
                          <th className="p-3">Acción</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-slate-800">
                        {Object.entries(users).filter(([_,u])=>u.role==='alumno').map(([key, u])=>(
                          <tr key={key} className={key === selectedStudentKey ? "bg-blue-950/40" : ""}>
                            <td className="p-3 font-semibold text-white">{u.name}</td>
                            <td className="p-3 text-blue-400 font-mono">{key}</td>
                            <td className="p-3 text-emerald-400 font-bold">{u.pts} pts</td>
                            <td className="p-3">
                              {u.mustChangePass ? (
                                <span className="bg-amber-950 text-amber-300 text-xs px-2.5 py-1 rounded-full border border-amber-500/30">Pendiente (PAESM2)</span>
                              ) : (
                                <span className="bg-emerald-950 text-emerald-300 text-xs px-2.5 py-1 rounded-full border border-emerald-500/30">Actualizada</span>
                              )}
                            </td>
                            <td className="p-3">
                              <button 
                                onClick={()=>{ setSelectedStudentKey(key); setActiveTab("entrenador"); }}
                                className="bg-blue-600 hover:bg-blue-500 text-white font-bold text-xs px-3 py-1.5 rounded-lg transition"
                              >
                                Ver Pantalla →
                              </button>
                            </td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                </div>

                <div className="bg-slate-900 p-6 rounded-2xl border border-slate-800">
                  <h3 className="text-lg font-bold text-white mb-4">Buzón de Consultas Recibidas</h3>
                  {teacherMessages.length === 0 ? (
                    <p className="text-sm text-slate-400">No hay mensajes pendientes.</p>
                  ) : (
                    <div className="space-y-3">
                      {teacherMessages.map((m, idx)=>(
                        <div key={idx} className="bg-slate-950 p-4 rounded-xl border border-slate-800">
                          <div className="flex justify-between text-xs text-slate-400 mb-1">
                            <span className="font-bold text-blue-400">{m.student}</span>
                            <span>{m.time}</span>
                          </div>
                          <p className="text-sm text-slate-200">{m.text}</p>
                        </div>
                      ))}
                    </div>
                  )}
                </div>
              </div>
            )}
          </main>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
